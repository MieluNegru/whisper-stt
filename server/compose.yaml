# Whisper speech-to-text stack (CPU)
#
#  speaches        -> OpenAI-compatible REST API + streaming (port 8000)
#                     used by: curl/scripts, desktop dictation, anything that speaks the OpenAI audio API
#  faster-whisper  -> Wyoming protocol server (port 10300)
#                     used by: Home Assistant (Settings > Devices & services > Add > Wyoming Protocol)
#
# The two services are separate processes, so each loads its OWN copy of its model into
# its own memory -- a shared volume would dedupe them on disk but never in RAM. Hence the
# asymmetry below: speaches runs medium (dictation wants the accuracy, and it unloads when
# idle), while the Home Assistant path runs small-int8 (~0.5 GB resident, always loaded).

services:
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: speaches
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    # Models load on first request and unload after a period of inactivity.
    # Download the medium model once after starting:
    #   curl -X POST http://localhost:8000/v1/models/Systran/faster-whisper-medium

  faster-whisper:
    image: lscr.io/linuxserver/faster-whisper:latest
    container_name: faster-whisper
    restart: unless-stopped
    ports:
      - "10300:10300"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bucharest
      # small-int8 (~0.5 GB) rather than medium-int8 (~1-1.5 GB): this path is pinned to
      # English by WHISPER_LANG below, where the accuracy gap is small. Romanian never
      # reaches here -- dictation goes to speaches/medium instead.
      - WHISPER_MODEL=small-int8
      - WHISPER_BEAM=1        # raise to 3-5 for accuracy at the cost of speed
      - WHISPER_LANG=en       # HA voice works best with a fixed language; "auto" also works
    volumes:
      - ./faster-whisper:/config

volumes:
  hf-hub-cache:
