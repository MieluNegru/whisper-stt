# Copy to ~/.config/hypr/dictate.conf and add to hyprland.conf:
#   source = ~/.config/hypr/dictate.conf
# Super+D  -> dictate in English (press to start, press again to stop)
# Super+Shift+D -> dictate in Romanian

env = WHISPER_URL,http://gb-server:8000

bind = SUPER, D, exec, ~/.local/bin/dictate.sh en
bind = SUPER SHIFT, D, exec, ~/.local/bin/dictate.sh ro

# Hold-to-talk variant instead (record while held, transcribe on release):
# bind  = SUPER, D, exec, ~/.local/bin/dictate.sh en
# bindr = SUPER, D, exec, ~/.local/bin/dictate.sh en
